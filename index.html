      <div style="padding:2rem;font-family:system-ui,sans-serif;color:#111;max-width:70ch;">
        <h1>Francesco Marzola — Strategic Design &amp; Direction</h1>
        <p>Portfolio narrativo. Prima la strategia, poi la creatività: positioning, naming, identità verbale e visiva, campagne e contenuti. CEO di Able Creative Studio a Roma e partner di NextAdv. Contatti: marzola.fra@gmail.com — LinkedIn: https://www.linkedin.com/in/francescomarzola</p>

        <h2>Cosa faccio</h2>
        <p>Positioning · Naming · Visual identity · Verbal identity · Ads · Creative content</p>

        <h2>Qualcuno ti ha parlato di me.</h2>
        <p>Probabilmente ti ha detto che mi occupo di creatività. Giuro che lo faccio per lavoro.</p>
        <p>Probabilmente ti ha detto che sono bravo. Qui trovi le prove.</p>

        <h2>Progetti selezionati</h2>
        <h3>01 — Exequia: Più unica che bara.</h3>
        <p>Exequia aveva bisogno di una posizione riconoscibile in un settore nel quale tutti i brand parlavano allo stesso modo. Un'identità verbale non è una semplice esecuzione creativa, è una scelta che riscrive i limiti di una categoria e permette a un brand di entrare davvero nella mente delle persone.</p>
        <h3>02 — ComparaSemplice: Lo zio Gerry sta Qua!</h3>
        <p>Campagna per il comparatore di tariffe luce, gas e telefonia. Obiettivo: rendere semplice una scelta complicata. La mossa: Gerry Scotti, la rassicurazione italiana, a interrogare una papera viola.</p>
        <h3>03 — McFit: Il fitness (quasi) senza rimorso.</h3>
        <p>Campagna #SenzaRimorso per una delle catene di palestre più grandi d'Europa. Obiettivo: parlare a chi non va in palestra perché si sente già in colpa. Concept: il fitness, finalmente, senza rimorso.</p>
        <h3>04 — Antico Forno Roscioli: Il pane è di tutti.</h3>
        <p>Posizionamento e verbal identity per un'istituzione del pane romano. Obiettivo ambizioso: meritarsi la scena giusta. Arrivarci come ospite d'onore alla puntata speciale di MasterChef è il miglior finale possibile.</p>

        <h2>Il metodo</h2>
        <p>Faccio domande finché una risposta non mi sorprende. Di solito l'idea è lì.</p>
        <p>Un'idea bella che nessuno ricorda non è un'idea. È una spesa.</p>
        <p>Dal logo al post, ogni pezzo dice la stessa cosa. Altrimenti non è un brand. È un collage.</p>

        <h2>Chi sono</h2>
        <p>Lo faccio da quasi vent'anni. Oggi sono CEO di Able Creative Studio™, a Roma, e partner di NextAdv. Autore di The Unlikeness™ (https://unlikeness.substack.com).</p>

        <h2>CheckYourBrand™</h2>
        <p>Un check-up gratuito su come il mercato percepisce il tuo brand. Brand analizzati: Exequia, ComparaSemplice, McFit, Campus Bio-Medico, Eurobet.Live, Treccani. Scopri di più su https://checkyourbrand.it</p>

        <h2>Parliamone</h2>
        <p>Chi ti ha parlato di me forse sapeva già tutto. E pensava ne valesse la pena. Scopriamo se aveva ragione.</p>
