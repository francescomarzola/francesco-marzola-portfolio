# Deploy gratuito su GitHub Pages.
# NON si attiva da solo finché Pages non è abilitato nel repository
# (Settings → Pages → Source: "GitHub Actions"). Vedi README.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Ricostruisce ogni giorno alle 06:17 UTC per aggiornare l'anteprima newsletter
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
